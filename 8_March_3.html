<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Құттықтау 💌</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ffd6ec,#fff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.container{
    background:white;
    padding:25px;
    border-radius:25px;
    width:90%;
    max-width:420px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.envelope{
    font-size:90px;
    cursor:pointer;
    margin-top:20px;
}

.card{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#fff0f6;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
    margin:8px;
    padding:8px 16px;
    border-radius:20px;
    border:none;
    background:#ff4081;
    color:white;
    cursor:pointer;
}

.result{
    margin-top:15px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container" id="main">
    <h2>Бұл не? 🤔</h2>

    <div class="envelope" onclick="openCard()">💌</div>

    <div class="card" id="congratsCard">
        Айдана мен сізді 8 нәурызбен шын жүректен құттықтаймын.
        Алдағы праваға тапсыратын тесттеріңізде сәттілік.
        Мен сыйлаған сыйлықтағы сияқты сүйкімді болып жүре беріңіз.
        Өмір жолыңыз жеңіл және қуанышқа толы болсын.
        Тағыда 8 нәурызбен құттықтаймын.
        Сізге бүгінгі квест ұнадыма?

        <br><br>

        <button onclick="like(true)">Иә ұнады</button>
        <button onclick="like(false)">Ұнамады</button>

        <div class="result" id="result"></div>
    </div>
</div>

<script>
function openCard(){
    document.getElementById("congratsCard").style.display="block";
}

function like(answer){
    let result=document.getElementById("result");
    if(answer){
        result.innerHTML="😊 Ұнағанына қуаныштымын!";
    }else{
        result.innerHTML="😢 Жарайды";
    }
}
</script>

</body>
</html>
